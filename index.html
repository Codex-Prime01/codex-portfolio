    <!-- Set the theme before first paint, so light mode never flashes dark. -->
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem("cp-theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
